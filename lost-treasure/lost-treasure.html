<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Lost Treasure</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<style>
  :root{
    --gold: #d9b25f;
    --gold-bright: #f3d98a;
    --ember: #ff7a29;
    --ember-deep: #b5330f;
    --void: #070504;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#000; font-family:'EB Garamond', serif; color:#e9d9b6;
    -webkit-tap-highlight-color: transparent;
  }
  #app{ position:fixed; inset:0; width:100%; height:100%; }
  canvas#scene{ position:absolute; inset:0; display:block; touch-action:none; }

  .display{ font-family:'Cinzel Decorative','Cinzel',serif; letter-spacing:0.08em; }
  .heading{ font-family:'Cinzel',serif; letter-spacing:0.22em; }

  #vignette{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 38%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0.92) 100%);
  }
  #grain{
    position:absolute; inset:0; pointer-events:none; z-index:6; opacity:0.045; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  #blackout{
    position:absolute; inset:0; background:#000; z-index:50; pointer-events:none;
  }

  #loading{
    position:absolute; inset:0; z-index:60; background:#040302;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity 1s ease;
  }
  #loading .title{ font-size:clamp(1.1rem, 3vw, 1.6rem); color: var(--gold); text-transform:uppercase; margin-bottom:28px; opacity:0.9;
    animation: flicker 2.4s ease-in-out infinite; }
  @keyframes flicker{ 0%,100%{opacity:0.85;} 45%{opacity:1;} 50%{opacity:0.6;} 55%{opacity:0.95;} }
  #loading .bar-track{ width:min(70vw,360px); height:2px; background:rgba(217,178,95,0.18); position:relative; }
  #loading .bar-fill{ position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg,var(--ember-deep),var(--gold-bright)); box-shadow:0 0 12px var(--ember); }
  #loading .pct{ margin-top:14px; font-size:0.75rem; letter-spacing:0.3em; color:#a98a52; }

  .panel{
    position:absolute; left:50%; bottom:9%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; text-align:center;
    z-index:10; width:min(92vw, 620px); pointer-events:none;
  }
  .panel.hidden{ display:none; }
  .eyebrow{ font-size:0.68rem; color:#c79a4c; letter-spacing:0.5em; margin-bottom:10px; opacity:0.85; text-transform:uppercase; }
  .title-main{ font-size:clamp(1.8rem, 5.2vw, 3.1rem); color:var(--gold-bright);
    text-shadow: 0 0 22px rgba(255,150,60,0.45), 0 0 4px rgba(0,0,0,0.8); margin:0 0 10px 0; }
  .subtitle{ font-style:italic; font-size:clamp(0.85rem,1.6vw,1.05rem); color:#d8c39a; opacity:0.85; margin:0 0 26px 0; max-width:480px; }

  .rune-btn{
    pointer-events:auto; cursor:pointer; position:relative; background:rgba(10,7,4,0.55);
    border:1px solid rgba(217,178,95,0.55); color:var(--gold-bright);
    padding:14px 38px; font-size:0.82rem; letter-spacing:0.32em; text-transform:uppercase;
    backdrop-filter: blur(2px); transition: all 0.35s ease; overflow:hidden;
  }
  .rune-btn::before{
    content:''; position:absolute; inset:0; background:radial-gradient(circle at 50% 120%, rgba(255,150,60,0.35), transparent 60%);
    opacity:0; transition:opacity 0.35s ease;
  }
  .rune-btn:hover{ transform:scale(1.045); border-color:var(--gold-bright); box-shadow:0 0 26px rgba(255,150,60,0.4), inset 0 0 18px rgba(255,150,60,0.15); }
  .rune-btn:hover::before{ opacity:1; }
  .rune-btn:active{ transform:scale(0.98); }
  .rune-btn:disabled{ opacity:0.35; pointer-events:none; }

  .btn-row{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; pointer-events:auto; }
  .rune-btn.secondary{ border-color:rgba(180,160,120,0.35); color:#cbb98c; padding:14px 30px; font-size:0.72rem; }

  #hint{
    position:absolute; top:22px; left:50%; transform:translateX(-50%); z-index:10;
    font-size:0.68rem; letter-spacing:0.28em; color:#c9ac6b; opacity:0.65; text-transform:uppercase;
    pointer-events:none; transition:opacity 0.8s ease;
  }

  #brand{
    position:absolute; top:22px; left:28px; z-index:10; font-size:0.72rem; letter-spacing:0.35em;
    color:#c9ac6b; opacity:0.75; text-transform:uppercase; pointer-events:none;
  }

  #sound-toggle{
    position:absolute; top:20px; right:24px; z-index:12; width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(217,178,95,0.4); background:rgba(10,7,4,0.5); color:var(--gold);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:0.95rem;
    pointer-events:auto; transition:all .3s ease;
  }
  #sound-toggle:hover{ border-color:var(--gold-bright); box-shadow:0 0 14px rgba(255,150,60,0.35); }

  @media (max-width: 640px){
    .panel{ bottom:6%; }
    #hint{ display:none; }
  }
</style>
</head>
<body>

<div id="app">
  <canvas id="scene"></canvas>
  <div id="vignette"></div>
  <div id="grain"></div>

  <div id="brand" class="heading">Chamber&nbsp;of&nbsp;Embers</div>
  <div id="hint" class="heading">drag to look &middot; scroll to zoom</div>
  <button id="sound-toggle" title="Toggle sound">&#128264;</button>

  <div id="loading">
    <div class="title heading">Awakening the Dragon&hellip;</div>
    <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>
    <div class="pct heading" id="pct">0%</div>
  </div>

  <div id="blackout"></div>

  <!-- Intro panel -->
  <div class="panel" id="panel-intro">
    <div class="eyebrow">A guarded reliquary</div>
    <h1 class="title-main display">The Lost Treasure</h1>
    <p class="subtitle">Unlock what has been guarded for centuries.</p>
    <div class="btn-row">
      <button class="rune-btn heading" id="btn-unlock">Unlock the Treasure</button>
    </div>
  </div>

  <!-- Final panel -->
  <div class="panel hidden" id="panel-final">
    <div class="eyebrow">The seal is broken</div>
    <h1 class="title-main display">The Treasure is Yours</h1>
    <p class="subtitle">Centuries of silence, ended.</p>
    <div class="btn-row">
      <button class="rune-btn heading" id="btn-explore">Explore the Treasure</button>
      <button class="rune-btn secondary heading" id="btn-again">Open Again</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   0. GLOBAL SETUP
   ============================================================ */
const isMobile = window.innerWidth < 768 || /Mobi|Android/i.test(navigator.userAgent);
const canvas = document.getElementById('scene');
const clock = new THREE.Clock();

let W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = !isMobile;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const fogColor = 0x0a0705;
scene.fog = new THREE.FogExp2(fogColor, 0.052);
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(42, W/H, 0.1, 100);
const camHome = new THREE.Vector3(0, 3.55, 9.2);
const camLookHome = new THREE.Vector3(0, 2.1, 0);
camera.position.copy(camHome);
camera.lookAt(camLookHome);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(camLookHome);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 5.5;
controls.maxDistance = 12.5;
controls.minPolarAngle = Math.PI*0.28;
controls.maxPolarAngle = Math.PI*0.52;
controls.minAzimuthAngle = -Math.PI*0.32;
controls.maxAzimuthAngle = Math.PI*0.32;
controls.enabled = false; // enabled after intro reveal

/* ------------------------------------------------------------
   Post processing
   ------------------------------------------------------------ */
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(W,H), 0.9, 0.85, 0.72);
bloomPass.threshold = 0.72;
bloomPass.strength = 0.62;
bloomPass.radius = 0.55;
composer.addPass(bloomPass);

/* ------------------------------------------------------------
   Utility: soft circular sprite texture for particles
   ------------------------------------------------------------ */
function makeSpriteTexture(colorInner, colorOuter){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0, colorInner);
  g.addColorStop(0.4, colorInner);
  g.addColorStop(1, colorOuter);
  ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
  const tex = new THREE.CanvasTexture(c);
  return tex;
}
const emberTex = makeSpriteTexture('rgba(255,210,140,1)', 'rgba(255,90,20,0)');
const goldTex  = makeSpriteTexture('rgba(255,240,200,1)', 'rgba(255,190,80,0)');
const smokeTex = (function(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(90,80,70,0.55)');
  g.addColorStop(1,'rgba(90,80,70,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();

/* ------------------------------------------------------------
   Utility: rune glyph texture (procedural, glowing)
   ------------------------------------------------------------ */
function makeRuneTexture(){
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,256,256);
  ctx.strokeStyle = '#ffb15c';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.shadowColor = '#ff8a33';
  ctx.shadowBlur = 18;
  ctx.translate(128,128);
  // simple flame / rune glyph: circle + inner triangle + radiating ticks
  ctx.beginPath(); ctx.arc(0,0,78,0,Math.PI*2); ctx.stroke();
  ctx.beginPath();
  for(let i=0;i<3;i++){
    const a = -Math.PI/2 + i*(Math.PI*2/3);
    const x = Math.cos(a)*52, y = Math.sin(a)*52;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.stroke();
  for(let i=0;i<8;i++){
    const a = i*(Math.PI*2/8);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*84, Math.sin(a)*84);
    ctx.lineTo(Math.cos(a)*100, Math.sin(a)*100);
    ctx.stroke();
  }
  return new THREE.CanvasTexture(c);
}
const runeTexture = makeRuneTexture();

/* ============================================================
   1. LIGHTING
   ============================================================ */
const ambient = new THREE.AmbientLight(0x2a1c12, 0.35);
scene.add(ambient);

const moon = new THREE.DirectionalLight(0x8899ff, 0.06);
moon.position.set(-6, 10, -4);
scene.add(moon);

const chestSpot = new THREE.SpotLight(0xffb066, 0, 14, Math.PI*0.22, 0.6, 1.4);
chestSpot.position.set(0, 7.5, 4.5);
chestSpot.target.position.set(0, 1, 0);
chestSpot.castShadow = !isMobile;
if(chestSpot.shadow){ chestSpot.shadow.mapSize.set(1024,1024); chestSpot.shadow.bias=-0.001; }
scene.add(chestSpot, chestSpot.target);

const keyLight = new THREE.PointLight(0xffcf8a, 0, 6.5, 2);
keyLight.position.set(0, 2.4, 2.6);
scene.add(keyLight);

const interiorLight = new THREE.PointLight(0xffb04a, 0, 8, 2);
interiorLight.position.set(0, 1.6, 0.2);
scene.add(interiorLight);

function makeBrazierLight(x){
  const l = new THREE.PointLight(0xff7a29, 1.15, 7.5, 2);
  l.position.set(x, 1.55, 3.3);
  return l;
}
const brazierLightL = makeBrazierLight(-3.6);
const brazierLightR = makeBrazierLight(3.6);
scene.add(brazierLightL, brazierLightR);

const dragonGlow = new THREE.PointLight(0xff5522, 0.0, 9, 2);
dragonGlow.position.set(0, 3.4, -5.6);
scene.add(dragonGlow);

/* ============================================================
   2. ENVIRONMENT — DUNGEON
   ============================================================ */
const dungeon = new THREE.Group();
scene.add(dungeon);

const stoneMat = new THREE.MeshStandardMaterial({ color:0x201a16, roughness:0.95, metalness:0.05 });
const stoneMatDark = new THREE.MeshStandardMaterial({ color:0x120e0b, roughness:1, metalness:0.02 });

// floor
const floor = new THREE.Mesh(new THREE.CylinderGeometry(9, 9.6, 0.4, 48), stoneMat);
floor.position.y = -0.2;
floor.receiveShadow = true;
dungeon.add(floor);

// cracked ring platform under chest
const ringGeo = new THREE.RingGeometry(1.7, 2.35, 48);
const ringMat = new THREE.MeshBasicMaterial({ color:0xff7a29, transparent:true, opacity:0.0, side:THREE.DoubleSide });
const glowRing = new THREE.Mesh(ringGeo, ringMat);
glowRing.rotation.x = -Math.PI/2;
glowRing.position.y = 0.011;
dungeon.add(glowRing);

const platform = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.7, 0.22, 40), stoneMatDark);
platform.position.y = -0.0;
platform.receiveShadow = true;
dungeon.add(platform);

// symbol ring texture (emissive circuit-like ring)
function makeSymbolRingTexture(){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const ctx=c.getContext('2d');
  ctx.translate(256,256);
  ctx.strokeStyle='#ff8a33'; ctx.lineWidth=4; ctx.shadowColor='#ff8a33'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.arc(0,0,220,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,190,0,Math.PI*2); ctx.stroke();
  for(let i=0;i<16;i++){
    const a = i*(Math.PI*2/16);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*190, Math.sin(a)*190);
    ctx.lineTo(Math.cos(a)*220, Math.sin(a)*220);
    ctx.stroke();
  }
  return new THREE.CanvasTexture(c);
}
const symbolRing = new THREE.Mesh(
  new THREE.RingGeometry(1.05,1.42,48),
  new THREE.MeshBasicMaterial({ map:makeSymbolRingTexture(), transparent:true, opacity:0.85, blending:THREE.AdditiveBlending, side:THREE.DoubleSide, depthWrite:false })
);
symbolRing.rotation.x = -Math.PI/2;
symbolRing.position.y = 0.02;
dungeon.add(symbolRing);

// pillars
const pillarGeo = new THREE.CylinderGeometry(0.42, 0.5, 6.4, 12);
const bannerMat = new THREE.MeshStandardMaterial({ color:0x4a0f0f, roughness:0.85, metalness:0.0, side:THREE.DoubleSide });
function addPillar(x, z){
  const p = new THREE.Mesh(pillarGeo, stoneMat);
  p.position.set(x, 3.0, z);
  p.castShadow = !isMobile; p.receiveShadow = true;
  dungeon.add(p);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(1.1,0.3,1.1), stoneMatDark);
  cap.position.set(x, 6.25, z);
  dungeon.add(cap);
  // banner
  const banner = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 3.2, 1, 6), bannerMat);
  banner.position.set(x, 3.3, z + (z<0? 0.55: -0.55));
  banner.rotation.y = z < 0 ? 0 : Math.PI;
  dungeon.add(banner);
}
addPillar(-5.4, 2.4); addPillar(5.4, 2.4);
addPillar(-6.6, -2.6); addPillar(6.6, -2.6);
addPillar(-4.2, -6.4); addPillar(4.2, -6.4);

// back wall (low poly, mostly hidden in fog/dark, gives dragon something to sit against)
const wallMat = new THREE.MeshStandardMaterial({ color:0x0e0b09, roughness:1 });
const backWall = new THREE.Mesh(new THREE.CylinderGeometry(9.4,9.4,9,32,1,true,Math.PI*0.15,Math.PI*1.7), wallMat);
backWall.position.y = 4.2;
backWall.material.side = THREE.BackSide;
dungeon.add(backWall);

/* ---------------- Fire braziers ---------------- */
function makeBrazier(x){
  const g = new THREE.Group();
  const goldMat = new THREE.MeshStandardMaterial({ color:0x8a6a2c, metalness:0.85, roughness:0.35, emissive:0x1a0e02, emissiveIntensity:0.4 });
  const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.14,1.3,8), goldMat);
  stand.position.y = 0.65;
  const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.22,0.28,10,1,true), goldMat);
  bowl.position.y = 1.32;
  g.add(stand, bowl);

  // flame particles
  const N = isMobile? 18: 34;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3+0] = (Math.random()-0.5)*0.22;
    pos[i*3+1] = Math.random()*0.5;
    pos[i*3+2] = (Math.random()-0.5)*0.22;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({ size:0.34, map:emberTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, color:0xffa04a });
  const flame = new THREE.Points(geo, mat);
  flame.position.y = 1.4;
  g.add(flame);
  g.userData.flame = flame;
  g.position.x = x;
  g.position.z = 3.3;
  return g;
}
const brazierL = makeBrazier(-3.6);
const brazierR = makeBrazier(3.6);
dungeon.add(brazierL, brazierR);

/* ============================================================
   3. PARTICLE SYSTEMS (ambient)
   ============================================================ */
function makeParticleSystem(count, spread, yRange, tex, size, color, speed){
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const spd = new Float32Array(count);
  for(let i=0;i<count;i++){
    pos[i*3+0] = (Math.random()-0.5)*spread.x;
    pos[i*3+1] = Math.random()*yRange.y + yRange.x;
    pos[i*3+2] = (Math.random()-0.5)*spread.z;
    spd[i] = 0.4 + Math.random()*speed;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({ size, map:tex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, color, opacity:0.85 });
  const pts = new THREE.Points(geo, mat);
  pts.userData.speeds = spd;
  return pts;
}
const emberField = makeParticleSystem(isMobile?40:90, {x:9,z:7}, {x:0,y:5}, emberTex, 0.09, 0xff8c3f, 0.5);
const dustField  = makeParticleSystem(isMobile?30:70, {x:10,z:8}, {x:0.2,y:3.5}, smokeTex, 0.5, 0x998866, 0.12);
scene.add(emberField, dustField);

// key magic particles (small ring around key)
const KEY_PN = isMobile? 26: 50;
const keyParticleGeo = new THREE.BufferGeometry();
const keyParticlePos = new Float32Array(KEY_PN*3);
const keyParticleAngle = new Float32Array(KEY_PN);
const keyParticleRad = new Float32Array(KEY_PN);
for(let i=0;i<KEY_PN;i++){
  keyParticleAngle[i] = Math.random()*Math.PI*2;
  keyParticleRad[i] = 0.35 + Math.random()*0.35;
  keyParticlePos[i*3+1] = (Math.random()-0.5)*0.8;
}
keyParticleGeo.setAttribute('position', new THREE.BufferAttribute(keyParticlePos,3));
const keyParticleMat = new THREE.PointsMaterial({ size:0.07, map:goldTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, color:0xffe6a8, opacity:0.95 });
const keyParticles = new THREE.Points(keyParticleGeo, keyParticleMat);

/* ============================================================
   4. TREASURE CHEST
   ============================================================ */
const CW = 2.55, CH = 1.25, CD = 1.6; // chest body dims
const goldMetal = new THREE.MeshStandardMaterial({ color:0xd9a83c, metalness:0.92, roughness:0.25, emissive:0x351a02, emissiveIntensity:0.3 });
const darkMetal = new THREE.MeshStandardMaterial({ color:0x1b1a1c, metalness:0.75, roughness:0.5 });
const woodDark  = new THREE.MeshStandardMaterial({ color:0x171310, metalness:0.2, roughness:0.85 });
const clothRed  = new THREE.MeshStandardMaterial({ color:0x5c1414, roughness:0.9 });
const runeMat   = new THREE.MeshBasicMaterial({ map: runeTexture, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0 });

const chestGroup = new THREE.Group();
chestGroup.position.set(0, 0.11, 0);
dungeon.add(chestGroup);

function makeWing(sign){
  const shape = new THREE.Shape();
  shape.moveTo(0,0);
  shape.quadraticCurveTo(1.6*sign, 0.9, 2.6*sign, 0.4);
  shape.quadraticCurveTo(2.1*sign, -0.1, 2.3*sign, -0.9);
  shape.quadraticCurveTo(1.4*sign, -0.5, 1.0*sign, -1.1);
  shape.quadraticCurveTo(0.5*sign, -0.5, 0, -0.2);
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape, 6);
  const mat = new THREE.MeshStandardMaterial({ color:0x0c0a09, roughness:0.7, metalness:0.1, side:THREE.DoubleSide, emissive:0x220800, emissiveIntensity:0.0 });
  const mesh = new THREE.Mesh(geo, mat);
  return mesh;
}

/* ============================================================
   7. AUDIO (procedural WebAudio placeholders — replace with real files)
   ============================================================ */
const AudioMgr = (function(){
  let ctx = null, master = null, enabled = true, started = false;
  let humOsc = null, humGain = null;

  function ensure(){
    if(ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
  }
  function start(){
    if(started) return; started = true;
    ensure();
    if(ctx.state === 'suspended') ctx.resume();
    // ambient dungeon hum
    humOsc = ctx.createOscillator(); humOsc.type='sine'; humOsc.frequency.value=48;
    humGain = ctx.createGain(); humGain.gain.value = enabled? 0.05:0;
    humOsc.connect(humGain); humGain.connect(master); humOsc.start();
    // fire crackle via filtered noise
    const bufferSize = ctx.sampleRate*2;
    const buf = ctx.createBuffer(1,bufferSize,ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1)*0.6;
    const noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.6;
    const ng = ctx.createGain(); ng.gain.value = enabled? 0.035:0;
    noise.connect(bp); bp.connect(ng); ng.connect(master); noise.start();
  }
  function blip(freq=880, dur=0.12, type='sine', vol=0.18, delay=0){
    if(!enabled) return; ensure();
    const t = ctx.currentTime+delay;
    const o = ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(freq,t);
    const g = ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
  }
  function sweep(f1,f2,dur=0.8,vol=0.14,type='sawtooth',delay=0){
    if(!enabled) return; ensure();
    const t = ctx.currentTime+delay;
    const o = ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    const filt = ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.setValueAtTime(f1*2,t); filt.frequency.exponentialRampToValueAtTime(f2*1.5,t+dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+dur*0.25); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(filt); filt.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
  }
  function noiseBurst(dur=0.9,vol=0.25,delay=0,lowpass=400){
    if(!enabled) return; ensure();
    const t = ctx.currentTime+delay;
    const bufferSize = ctx.sampleRate*dur;
    const buf = ctx.createBuffer(1,bufferSize,ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1)*(1-i/bufferSize);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const filt = ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value = lowpass;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(filt); filt.connect(g); g.connect(master); src.start(t);
  }
  return {
    start,
    setEnabled(v){ enabled=v; if(humGain) humGain.gain.value = v? 0.05:0; },
    isEnabled(){ return enabled; },
    keyActivate(){ blip(1200,0.25,'sine',0.12); },
    keyWhoosh(){ sweep(300,900,1.6,0.1,'sine'); },
    lockClick(){ blip(220,0.18,'square',0.16); blip(1600,0.08,'triangle',0.08,0.05); },
    lockTurn(){ sweep(140,80,0.5,0.18,'sawtooth'); },
    unlockChime(){ blip(660,0.4,'sine',0.14); blip(990,0.5,'sine',0.12,0.1); blip(1320,0.6,'sine',0.1,0.2); },
    chestCreak(){ sweep(90,60,1.2,0.2,'sawtooth'); },
    goldWhoosh(){ noiseBurst(1.4,0.22,0,2200); sweep(200,1800,1.2,0.12,'sine'); },
    coins(){ for(let i=0;i<6;i++) blip(1400+Math.random()*800,0.15,'triangle',0.05,i*0.05); },
    dragonRoar(){ noiseBurst(1.8,0.28,0,220); sweep(90,50,1.8,0.22,'sawtooth'); }
  };
})();

document.getElementById('sound-toggle').addEventListener('click', (e)=>{
  const on = !AudioMgr.isEnabled();
  AudioMgr.setEnabled(on);
  e.currentTarget.innerHTML = on ? '&#128264;' : '&#128263;';
});

   8. STATE MACHINE + ANIMATION SEQUENCES
   ============================================================ */
const STATES = ['IDLE','KEY_ACTIVATED','KEY_MOVING','KEY_INSERTING','KEY_TURNING','UNLOCKED','CHEST_OPENING','TREASURE_REVEAL','DRAGON_REACTION','COMPLETE'];
let state = 'BOOT';
let introDone = false;
let interactionLocked = true;

function setState(s){ state = s; }

/* ---- idle floating animation values ---- */
let idleActive = false;
const keyIdleBase = keyRestPos.clone();

/* ---- Intro reveal timeline ---- */
const revealFlags = { dungeon:0, dragon:0, chest:0, key:0 };

function playIntro(){
  const tl = gsap.timeline({ onComplete:()=>{ introDone = true; interactionLocked = false; controls.enabled = true; showPanel('intro'); } });

  tl.to('#blackout', { opacity:0, duration:1.5, ease:'power2.out' }, 0);
  tl.to(ambient, { intensity:0.35, duration:1.5 }, 0);

  // dungeon reveal 1.5-3s
  tl.to(revealFlags, { dungeon:1, duration:1.5, onUpdate:()=>{
      brazierLightL.intensity = 1.15*revealFlags.dungeon;
      brazierLightR.intensity = 1.15*revealFlags.dungeon;
      chestSpot.intensity = 2.2*revealFlags.dungeon;
    } }, 1.5);

  // dragon silhouette reveal 3-4s
  tl.to(revealFlags, { dragon:1, duration:1.0, onUpdate:()=>{
      dragonGlow.intensity = 0.5*revealFlags.dragon;
      dragonGroup.traverse(o=>{ if(o.isMesh && o.material.emissiveIntensity!==undefined && o.material !== eyeMat) o.material.emissiveIntensity = 0.05*revealFlags.dragon; });
    } }, 3.0);

  // chest reveal 4-5s
  tl.fromTo(chestGroup.scale, {x:0.001,y:0.001,z:0.001}, {x:1,y:1,z:1, duration:1.0, ease:'back.out(1.4)'}, 4.0);
  tl.to(revealFlags, { chest:1, duration:1.0 }, 4.0);

  // key appears 5-6s
  tl.fromTo(keyGroup.scale, {x:0.001,y:0.001,z:0.001}, {x:1,y:1,z:1, duration:0.8, ease:'back.out(2)'}, 5.0);
  tl.to(keyLight, { intensity:1.4, duration:0.8 }, 5.0);
  tl.to(keyMat, { emissiveIntensity:0.5, duration:0.8 }, 5.0);

  // UI title
  tl.fromTo('#panel-intro .eyebrow, #panel-intro .title-main, #panel-intro .subtitle, #panel-intro .btn-row',
    { opacity:0, y:16 }, { opacity:1, y:0, duration:1, ease:'power2.out', stagger:0.12 }, 5.4);

  tl.call(()=>{ idleActive = true; AudioMgr.start(); }, null, 6.0);
  tl.to('#hint', { opacity:0.65, duration:0.8 }, 6.2);
}

/* ---- panel visibility ---- */
function showPanel(which){
  document.getElementById('panel-intro').classList.toggle('hidden', which!=='intro');
  document.getElementById('panel-final').classList.toggle('hidden', which!=='final');
}
showPanel('none');

/* ---- Camera helper ---- */
function animateCamera(pos, look, duration, ease){
  gsap.to(camera.position, { x:pos.x, y:pos.y, z:pos.z, duration, ease: ease||'power2.inOut' });
  gsap.to(controls.target, { x:look.x, y:look.y, z:look.z, duration, ease: ease||'power2.inOut' });
}

/* ---- Master unlock sequence ---- */
function startUnlockSequence(){
  if(state !== 'IDLE') return;
  interactionLocked = true;
  idleActive = false;
  controls.enabled = false;
  document.getElementById('btn-unlock').disabled = true;
  gsap.to('#panel-intro', { opacity:0, duration:0.5, onComplete:()=>showPanel('none') });
  AudioMgr.start();

  const tl = gsap.timeline({ onComplete:()=>{ setState('COMPLETE'); onSequenceComplete(); } });

  /* PHASE 1 — KEY ACTIVATION (~1s) */
  tl.call(()=>{ setState('KEY_ACTIVATED'); AudioMgr.keyActivate(); });
  tl.to(keyMat, { emissiveIntensity:1.4, duration:0.5 }, '<');
  tl.to(keyParticleMat, { opacity:1, size:0.1, duration:0.4 }, '<');
  tl.to(keyLight, { intensity:2.6, duration:0.5 }, '<');
  tl.to(camera.position, { x:camHome.x*0.85, y:camHome.y*0.92, z:camHome.z*0.86, duration:1, ease:'power2.inOut' }, '<');
  tl.to(keyGroup.rotation, { y: Math.PI*0.5, duration:1, ease:'power2.inOut' }, '<');

  /* PHASE 2 — KEY FLIES TO LOCK (~1.7s) */
  tl.call(()=>{ setState('KEY_MOVING'); AudioMgr.keyWhoosh(); });
  const lockWorldPos = new THREE.Vector3(0, CH*0.5+0.11, CD/2+0.18);
  tl.to(keyGroup.position, { x:lockWorldPos.x, y:lockWorldPos.y, z:lockWorldPos.z+0.55, duration:1.4, ease:'power3.inOut' }, '<');
  tl.to(keyGroup.rotation, { x:Math.PI*0.5, y:0, z:0, duration:1.2, ease:'power2.inOut' }, '<');

  /* PHASE 3 — KEY INSERTION (~0.8s) */
  tl.call(()=>{ setState('KEY_INSERTING'); AudioMgr.lockClick(); });
  tl.to(keyGroup.position, { z:lockWorldPos.z-0.02, duration:0.7, ease:'power2.in' }, '>-0.1');
  tl.to(chestBody.position, { x:0.015, duration:0.06, yoyo:true, repeat:5 }, '>-0.1');
  tl.to(runeMat, { opacity:0.9, duration:0.5 }, '<');
  chestGroup.traverse(o=>{ if(o.material && o.material.map===runeTexture){ tl.to(o.material,{opacity:0.9,duration:0.5},'<'); }});

  /* PHASE 4 — KEY TURNS (~0.9s) */
  tl.call(()=>{ setState('KEY_TURNING'); AudioMgr.lockTurn(); });
  tl.to(keyGroup.rotation, { z: Math.PI*0.5, duration:0.7, ease:'power3.inOut' }, '<');
  tl.to(camera.position, { x:'+=0.06', duration:0.08, yoyo:true, repeat:5 }, '<');
  tl.to(bloomPass, { strength:1.3, duration:0.4 }, '<');
  tl.to(keyGroup.position, { z:lockWorldPos.z+0.12, duration:0.5, ease:'power2.out' }, '>-0.1');

  /* PHASE 5 — CHEST UNLOCKS (~1s) */
  tl.call(()=>{ setState('UNLOCKED'); AudioMgr.unlockChime(); });
  tl.to(chestGroup.position, { y:'+=0.015', duration:0.05, yoyo:true, repeat:9 }, '<');
  tl.to(glowRing.material, { opacity:0.65, duration:1 }, '<');
  tl.to(symbolRing.material, { opacity:1, duration:1 }, '<');
  tl.to(bloomPass, { strength:1.7, duration:1 }, '<');
  tl.to(ambient, { intensity:0.55, duration:1 }, '<');

  /* PHASE 6 — CHEST OPENS (~2.2s) — the main cinematic beat */
  tl.call(()=>{ setState('CHEST_OPENING'); AudioMgr.chestCreak(); });
  tl.to(lidPivot.rotation, { x:-1.85, duration:2.0, ease:'power2.out' }, '<');
  tl.to(interiorLight, { intensity:3.2, duration:1.6 }, '<0.3');
  tl.to(beamMat, { opacity:0.55, duration:1.2 }, '<0.2');
  tl.to(lightBeam.scale, { x:1.3, y:1.3, z:1.3, duration:1.6 }, '<');
  tl.call(()=>{ AudioMgr.goldWhoosh(); }, null, '<0.3');
  animateCamera(new THREE.Vector3(camHome.x*1.05, camHome.y*1.08, camHome.z*1.15), new THREE.Vector3(0,1.6,-1.2), 2.2, 'power2.inOut');

  /* PHASE 7 — TREASURE REVEAL (~1.2s, overlapping) */
  tl.call(()=>{ setState('TREASURE_REVEAL'); AudioMgr.coins(); }, null, '<0.6');
  tl.fromTo(coinMesh.scale, { y:0.2 }, { y:1, duration:0.8, ease:'back.out(1.6)' }, '<');
  tl.fromTo(gemsGroup.scale, { x:0.001,y:0.001,z:0.001 }, { x:1,y:1,z:1, duration:0.7, ease:'back.out(2)' }, '<0.1');

  /* PHASE 8 — DRAGON REACTION (~1.6s) */
  tl.call(()=>{ setState('DRAGON_REACTION'); AudioMgr.dragonRoar(); }, null, '<0.4');
  tl.to(eyeMat, { color:new THREE.Color(0xff6a1a), duration:0.6 }, '<');
  tl.to(eyeLight, { intensity:1.6, duration:0.8 }, '<');
  tl.to(dragonGlow, { intensity:1.4, duration:0.8 }, '<');
  tl.to(mouthGlow.material, { opacity:0.85, duration:0.5 }, '<0.1');
  tl.to(jaw.position, { y:'-=0.09', duration:0.5, ease:'power2.out' }, '<');
  tl.to(headGroup.position, { z:'+=0.3', duration:1.0, ease:'power2.out' }, '<');
  tl.to(wingPivotL.rotation, { z:0.4, duration:0.4, yoyo:true, repeat:3 }, '<');
  tl.to(wingPivotR.rotation, { z:-0.4, duration:0.4, yoyo:true, repeat:3 }, '<');

  tl.to(bloomPass, { strength:0.85, duration:1.2 }, '>-0.4');
}

function onSequenceComplete(){
  interactionLocked = false;
  controls.enabled = true;
  controls.minAzimuthAngle = -Math.PI*0.32;
  controls.maxAzimuthAngle = Math.PI*0.32;
  showPanel('final');
}

/* ---- Explore / Open Again ---- */
document.getElementById('btn-explore').addEventListener('click', ()=>{
  controls.minAzimuthAngle = -Math.PI*0.85;
  controls.maxAzimuthAngle = Math.PI*0.85;
  controls.minPolarAngle = Math.PI*0.18;
  controls.maxPolarAngle = Math.PI*0.62;
  controls.minDistance = 3.5;
  controls.maxDistance = 15;
  gsap.to('#panel-final', { opacity:0, duration:0.5, onComplete:()=>showPanel('none') });
});

document.getElementById('btn-again').addEventListener('click', ()=>{
  if(state !== 'COMPLETE') return;
  gsap.to('#panel-final', { opacity:0, duration:0.4, onComplete:()=>showPanel('none') });
  const tl = gsap.timeline({ onComplete:resetForReplay });
  tl.to(lidPivot.rotation, { x:0, duration:1.1, ease:'power2.inOut' });
  tl.to(coinMesh.scale, { y:0.2, duration:0.4 }, '<');
  tl.to(gemsGroup.scale, { x:0.001,y:0.001,z:0.001, duration:0.4 }, '<');
  tl.to(interiorLight, { intensity:0, duration:0.6 }, '<');
  tl.to(beamMat, { opacity:0, duration:0.6 }, '<');
  tl.to(lightBeam.scale, { x:1,y:1,z:1, duration:0.6 }, '<');
  tl.to(mouthGlow.material, { opacity:0, duration:0.4 }, '<');
  tl.to(jaw.position, { y:0, duration:0.5 }, '<');
  tl.to(headGroup.position, { z:2.05-0, duration:0.8 }, '<');
  tl.to(eyeLight, { intensity:0.15, duration:0.8 }, '<');
  tl.to(dragonGlow, { intensity:0.5, duration:0.8 }, '<');
  tl.to(glowRing.material, { opacity:0, duration:0.6 }, '<');
  tl.to(symbolRing.material, { opacity:0.85, duration:0.6 }, '<');
  tl.to(bloomPass, { strength:0.62, duration:0.8 }, '<');
  tl.to(keyGroup.position, { x:keyRestPos.x, y:keyRestPos.y, z:keyRestPos.z, duration:1.1, ease:'power2.inOut' }, '<');
  tl.to(keyGroup.rotation, { x:0, y:0, z:0, duration:1.1, ease:'power2.inOut' }, '<');
  tl.to(keyMat, { emissiveIntensity:0.5, duration:0.8 }, '<');
  animateCamera(camHome, camLookHome, 1.3, 'power2.inOut');
});

function resetForReplay(){
  setState('IDLE');
  idleActive = true;
  interactionLocked = false;
  controls.enabled = true;
  controls.minAzimuthAngle = -Math.PI*0.32;
  controls.maxAzimuthAngle = Math.PI*0.32;
  controls.minPolarAngle = Math.PI*0.28;
  controls.maxPolarAngle = Math.PI*0.52;
  controls.minDistance = 5.5;
  controls.maxDistance = 12.5;
  document.getElementById('btn-unlock').disabled = false;
  gsap.set('#panel-intro', { opacity:1 });
  showPanel('intro');
}

/* ============================================================
   9. INTERACTION
   ============================================================ */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
function onPointerDown(clientX, clientY){
  if(state !== 'IDLE' || interactionLocked) return;
  mouse.x = (clientX/W)*2-1;
  mouse.y = -(clientY/H)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(keyGroup.children, true);
  if(hits.length){ startUnlockSequence(); }
}
renderer.domElement.addEventListener('click', (e)=>{ onPointerDown(e.clientX, e.clientY); AudioMgr.start(); });
renderer.domElement.addEventListener('touchend', (e)=>{
  if(e.changedTouches && e.changedTouches[0]){ onPointerDown(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }
  AudioMgr.start();
}, { passive:true });

document.getElementById('btn-unlock').addEventListener('click', ()=>{ AudioMgr.start(); startUnlockSequence(); });

/* ============================================================
   10. RENDER LOOP
   ============================================================ */
function updateIdle(t){
  if(!idleActive) return;
  // key float
  keyGroup.position.y = keyIdleBase.y + Math.sin(t*1.4)*0.09;
  keyGroup.rotation.y = t*0.4;
  keyGroup.rotation.z = Math.sin(t*0.7)*0.08;
  // key particle ring
  const pos = keyParticles.geometry.attributes.position;
  for(let i=0;i<KEY_PN;i++){
    const a = keyParticleAngle[i] + t*0.6;
    const r = keyParticleRad[i];
    pos.array[i*3+0] = Math.cos(a)*r;
    pos.array[i*3+2] = Math.sin(a)*r*0.6;
  }
  pos.needsUpdate = true;
  keyLight.position.copy(keyGroup.position);
}

function updateDragonIdle(t){
  const breathe = 1 + Math.sin(t*0.55)*0.012;
  dBody.scale.set(1.5*breathe,1.05*breathe,2.1);
  wingPivotL.rotation.x = Math.sin(t*0.4)*0.05;
  wingPivotR.rotation.x = Math.sin(t*0.4+0.3)*0.05;
  headGroup.rotation.y = Math.sin(t*0.22)*0.08;
  // occasional blink
  const blink = (Math.sin(t*0.9) > 0.985) ? 0.15 : 1;
  eyeL.scale.y = eyeR.scale.y = blink;

  [smokeL, smokeR].forEach((sm, si)=>{
    const posAttr = sm.geometry.attributes.position;
    const life = sm.userData.life;
    for(let i=0;i<life.length;i++){
      life[i] += 0.006;
      if(life[i] > 1) life[i] = 0;
      const l = life[i];
      posAttr.array[i*3+0] = Math.sin(i*12.9+si)*0.05*l;
      posAttr.array[i*3+1] = l*0.7;
      posAttr.array[i*3+2] = l*0.5;
    }
    posAttr.needsUpdate = true;
    sm.material.opacity = 0.35*revealFlags.dragon;
  });
}

function updateAmbientParticles(dt, t){
  [emberField, dustField].forEach(sys=>{
    const pos = sys.geometry.attributes.position;
    const spd = sys.userData.speeds;
    for(let i=0;i<spd.length;i++){
      pos.array[i*3+1] += spd[i]*dt*0.3;
      pos.array[i*3+0] += Math.sin(t*0.5+i)*0.0015;
      if(pos.array[i*3+1] > 5.2) pos.array[i*3+1] = 0;
    }
    pos.needsUpdate = true;
  });
  [brazierL, brazierR].forEach(b=>{
    const flame = b.userData.flame;
    const pos = flame.geometry.attributes.position;
    for(let i=0;i<pos.array.length/3;i++){
      pos.array[i*3+1] += dt*0.9;
      if(pos.array[i*3+1] > 0.6) pos.array[i*3+1] = 0;
    }
    pos.needsUpdate = true;
  });
  brazierLightL.intensity = (1.0 + Math.sin(t*8)*0.12 + Math.sin(t*3.3)*0.08) * revealFlags.dungeon;
  brazierLightR.intensity = (1.0 + Math.sin(t*7.4+1)*0.12 + Math.sin(t*2.9)*0.08) * revealFlags.dungeon;
}

function onResize(){
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W/H; camera.updateProjectionMatrix();
  renderer.setSize(W,H);
  composer.setSize(W,H);
  bloomPass.setSize(W,H);
}
window.addEventListener('resize', onResize);

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  controls.update();
  updateIdle(t);
  updateDragonIdle(t);
  updateAmbientParticles(dt, t);
  symbolRing.rotation.z = t*0.05;
  composer.render();
}

/* ============================================================
   11. LOADING SEQUENCE (simulated staged progress)
   ============================================================ */
const barFill = document.getElementById('bar-fill');
const pctEl = document.getElementById('pct');
let progress = 0;
const loadStages = [12, 30, 52, 74, 90, 100];
let stageIdx = 0;
function pumpLoading(){
  if(stageIdx >= loadStages.length){
    setTimeout(()=>{
      document.getElementById('loading').style.opacity = '0';
      setTimeout(()=>{ document.getElementById('loading').style.display='none'; playIntro(); }, 900);
    }, 220);
    return;
  }
  const target = loadStages[stageIdx];
  const step = ()=>{
    progress += (target-progress)*0.18 + 0.4;
    if(progress >= target){ progress = target; }
    barFill.style.width = progress+'%';
    pctEl.textContent = Math.floor(progress)+'%';
    if(progress < target){ requestAnimationFrame(step); }
    else { stageIdx++; setTimeout(pumpLoading, 140+Math.random()*220); }
  };
  step();
}

/* kick off */
animate();
pumpLoading();

})();
</script>
